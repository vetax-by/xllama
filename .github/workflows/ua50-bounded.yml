name: Bounded diagnostics pinned unsigned UWP
on:
  workflow_dispatch:
    inputs:
      source_lock_sha256:
        description: Exact reviewed bounded source lock
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ua50-uwp-compile
  cancel-in-progress: false
jobs:
  compile:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.eol
      GIT_CONFIG_VALUE_1: lf
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: operator
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: gianlucamazza/xllama
          ref: 4db51522c850e62d0bb24234dfeb48e55f4017d7
          persist-credentials: false
          submodules: false
          path: product
      - name: Compose exact bounded native source on separate clean product
        env:
          SELECTED_SOURCE_LOCK: ${{ inputs.source_lock_sha256 }}
        run: |
          python operator/ua50/bounded/prepare.py product $env:SELECTED_SOURCE_LOCK
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile selected base and trace D3D12 shaders without replacing pinned blobs
        run: ./operator/ua50/bounded/compile_shaders.ps1 -Source product
      - name: Windows SDK compile link and unsigned package
        timeout-minutes: 36
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & ./operator/ua50/build_unsigned.ps1 -Source product -Output result -Track patch
          Copy-Item -LiteralPath "$env:GITHUB_WORKSPACE/product/BOUNDED-SHADER-RECEIPT.json" -Destination "$env:GITHUB_WORKSPACE/result/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bounded-unsigned-${{ github.run_id }}
          path: result/
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false
