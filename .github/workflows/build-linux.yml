name: Windows CreateFile2 sharing probe
on:
  workflow_dispatch:
permissions: {}
jobs:
  file-open:
    runs-on: windows-2022
    timeout-minutes: 3
    steps:
      - name: Exercise native reader while a separate process owns a file
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Windows $([Environment]::OSVersion.Version) image=$env:ImageVersion"
          Set-Location $env:RUNNER_TEMP
          @'
          using System;
          using System.IO;
          using System.Diagnostics;
          using System.Runtime.InteropServices;
          using System.Security.Cryptography;

          class Probe {
              [StructLayout(LayoutKind.Sequential)]
              struct OpenParameters {
                  public uint Size, Attributes, Flags, SecurityQos;
                  public IntPtr SecurityAttributes, TemplateFile;
              }

              [DllImport("kernel32.dll", ExactSpelling=true, CharSet=CharSet.Unicode, SetLastError=true)]
              static extern IntPtr CreateFile2(string path, uint access, uint share, uint disposition, ref OpenParameters parameters);

              [DllImport("kernel32.dll", SetLastError=true)]
              static extern bool CloseHandle(IntPtr handle);

              static int Reader(string path, string label, int expected) {
                  var p = new OpenParameters();
                  p.Size = (uint)Marshal.SizeOf(p);
                  p.Flags = 0x00200000; // FILE_FLAG_OPEN_REPARSE_POINT
                  IntPtr h = CreateFile2(path, 0x80000000, 1, 3, ref p); // GENERIC_READ, FILE_SHARE_READ, OPEN_EXISTING
                  int last = Marshal.GetLastWin32Error();
                  bool valid = h != new IntPtr(-1);
                  int result = valid ? 0 : last;
                  Console.WriteLine("PROBE case={0} pid={1} open={2} result={3} expected={4}", label, Process.GetCurrentProcess().Id, valid, result, expected);
                  if (valid && !CloseHandle(h)) return 2;
                  return result == expected ? 0 : 1;
              }

              static void Check(string path, string label, int expected) {
                  string exe = Process.GetCurrentProcess().MainModule.FileName;
                  var info = new ProcessStartInfo(exe, "read \"" + path + "\" " + label + " " + expected);
                  info.UseShellExecute = false;
                  using (var child = Process.Start(info)) {
                      if (!child.WaitForExit(15000) || child.ExitCode != 0) throw new Exception(label);
                  }
              }

              static int Main(string[] args) {
                  if (args.Length == 4 && args[0] == "read") return Reader(args[1], args[2], int.Parse(args[3]));
                  string dir = Path.Combine(Path.GetTempPath(), "open-probe-" + Guid.NewGuid().ToString("N"));
                  Directory.CreateDirectory(dir);
                  string path = Path.Combine(dir, "command.json");
                  byte[] data = System.Text.Encoding.ASCII.GetBytes("{\"test\":true}");
                  try {
                      Check(path, "missing", 2);
                      using (var writer = new FileStream(path, FileMode.CreateNew, FileAccess.Write, FileShare.ReadWrite | FileShare.Delete)) {
                          writer.Write(data, 0, data.Length);
                          writer.Flush(true);
                          Check(path, "flushed_writer_open", 32);
                      }
                      Check(path, "writer_closed", 0);
                      using (var reader = new FileStream(path, FileMode.Open, FileAccess.Read, FileShare.Read)) {
                          Check(path, "shared_reader_open", 0);
                      }
                      if (Convert.ToBase64String(File.ReadAllBytes(path)) != Convert.ToBase64String(data)) return 3;
                      Console.WriteLine("PROBE all_cases_passed=true writer_pid=" + Process.GetCurrentProcess().Id);
                      return 0;
                  } finally { Directory.Delete(dir, true); }
              }
          }
          '@ | Set-Content -Path Probe.cs -Encoding ASCII
          & "$env:WINDIR/Microsoft.NET/Framework64/v4.0.30319/csc.exe" /nologo /platform:x64 /out:Probe.exe Probe.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\Probe.exe
          exit $LASTEXITCODE
